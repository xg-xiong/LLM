[llm]
# 大模型接口基础地址（OpenAI 兼容，需以 /v1 结尾）
# DeepSeek 云端: https://api.deepseek.com/v1
# 本地 Ollama:  http://localhost:11434/v1
base_url = https://api.deepseek.com/v1

# 模型名称（deepseek-flash 快而便宜 / deepseek-v4-pro 更强）
model_name = deepseek-flash

# API Key（本地 Ollama 可写 ollama 或留空；留空会提示但不崩溃）
# 使用前复制本文件为 config.ini 并填入自己的 Key，config.ini 已被 .gitignore 忽略
api_key = your-api-key-here

# 采样温度 0~2，越大越随机，越小越确定
temperature = 0.7
